<!DOCTYPE html>
<html>
<head>
<title>Cadieux Founder Updates</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family: Arial;
background:#FBF3D4;
margin:0;
padding:40px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:30px;
border-radius:12px;
}

textarea{
width:100%;
height:100px;
margin-bottom:20px;
padding:10px;
border-radius:8px;
border:1px solid #ddd;
}

button{
background:#024628;
color:white;
padding:12px 25px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.update{
background:#f6f6f6;
padding:15px;
border-radius:8px;
margin-top:20px;
}

</style>
</head>

<body>

<div class="container">

<h2>Cadieux Daily Update</h2>

<h4>Tasks completed</h4>
<textarea id="tasks"></textarea>

<h4>Key progress</h4>
<textarea id="progress"></textarea>

<h4>Blockers</h4>
<textarea id="blockers"></textarea>

<h4>Tomorrow focus</h4>
<textarea id="tomorrow"></textarea>

<button onclick="saveUpdate()">Save Update</button>

<div id="updates"></div>

</div>

<script>

function saveUpdate(){

let tasks=document.getElementById("tasks").value
let progress=document.getElementById("progress").value
let blockers=document.getElementById("blockers").value
let tomorrow=document.getElementById("tomorrow").value

if(tasks=="" && progress=="" && blockers=="" && tomorrow==""){
alert("Please write at least one update")
return
}

let update={
date:new Date().toLocaleDateString(),
tasks:tasks,
progress:progress,
blockers:blockers,
tomorrow:tomorrow
}

let updates=JSON.parse(localStorage.getItem("updates")||"[]")

updates.unshift(update)

localStorage.setItem("updates",JSON.stringify(updates))

loadUpdates()

document.getElementById("tasks").value=""
document.getElementById("progress").value=""
document.getElementById("blockers").value=""
document.getElementById("tomorrow").value=""

}

function loadUpdates(){

let updates=JSON.parse(localStorage.getItem("updates")||"[]")

let html=""

updates.forEach(u=>{

html+=`
<div class="update">
<b>${u.date}</b><br><br>
<b>Tasks</b><br>${u.tasks}<br><br>
<b>Progress</b><br>${u.progress}<br><br>
<b>Blockers</b><br>${u.blockers}<br><br>
<b>Tomorrow</b><br>${u.tomorrow}
</div>
`

})

document.getElementById("updates").innerHTML=html

}

loadUpdates()

</script>

</body>
</html>
